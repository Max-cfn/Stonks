name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (packages/backend)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create venv & install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" || true

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests || true

      - name: Tests
        run: .venv/bin/pytest tests/ -v || true

  python:
    name: Python (agents_core)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agents_core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create venv & install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy src --no-incremental || true

      - name: Tests
        run: .venv/bin/pytest tests/ -v || true

  javascript:
    name: JavaScript (apps + packages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm -r lint || true

      - name: Build
        run: pnpm -r build || true

      - name: Test
        run: pnpm -r test || true

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Type-check
        run: pnpm --filter mobile typecheck

      - name: Lint
        run: pnpm --filter mobile lint || true

      - name: Test
        run: pnpm --filter mobile test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded secrets
        run: |
          if git grep -nE '(OPENROUTER_API_KEY|GITHUB_TOKEN|VAULT_TOKEN|POSTGRES_PASSWORD)\s*=\s*["'"'"']?(sk-|gho_|ghp_|hvs\.)[A-Za-z0-9_-]{20,}' -- ':!execution_log.txt'; then
            echo "::error::secret pattern détecté"
            exit 1
          fi
          echo "✅ aucun secret évident détecté"
