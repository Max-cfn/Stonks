version: "3"

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  STONKS — Taskfile racine                                            ║
# ║  Orchestre le monorepo polyglotte (TypeScript + Python).             ║
# ║                                                                      ║
# ║  Usage : task <nom>                                                  ║
# ║          task --list-all                                             ║
# ╚══════════════════════════════════════════════════════════════════════╝

vars:
  PROJECT_ROOT:
    sh: pwd
  PYTHON: python3
  AGENTS_VENV: "{{.PROJECT_ROOT}}/agents_core/.venv"
  BACKEND_VENV: "{{.PROJECT_ROOT}}/packages/backend/.venv"
  UV: uv

env:
  CI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

tasks:
  # ─── Setup ───────────────────────────────────────────────────────────
  setup:
    desc: "Installe toutes les dépendances (JS + Python) et initialise les venv"
    cmds:
      - task: setup:js
      - task: setup:backend
      - task: setup:agents
      - task: setup:gitnexus
      - echo "✅ Setup terminé. Tape 'task agents:dev' pour démarrer."

  setup:js:
    desc: "Installe les dépendances JS via pnpm"
    cmds:
      - pnpm install

  setup:agents:
    desc: "Crée le venv de agents_core et installe les deps Python via uv"
    dir: agents_core
    cmds:
      - command -v uv || (curl -LsSf https://astral.sh/uv/install.sh | sh && echo "Relance ce shell pour avoir uv dans le PATH.")
      - uv venv --python 3.12 .venv
      - uv pip install -e ".[dev]"

  setup:backend:
    desc: "Installation du venv backend avec toutes les dépendances"
    dir: packages/backend
    cmds:
      - command -v uv || (curl -LsSf https://astral.sh/uv/install.sh | sh)
      - uv venv --python 3.12 .venv
      - uv pip install -e ".[dev]"

  setup:gitnexus:
    desc: "Installe GitNexus globalement (knowledge graph pour code-review agentique)"
    cmds:
      - npm list -g gitnexus 2>/dev/null || sudo npm install -g gitnexus@latest
      - echo "GitNexus installé. Lance 'task agents:index' pour indexer le repo."

  # ─── Agents ──────────────────────────────────────────────────────────
  agents:dev:
    desc: "Lance l'orchestrateur principal en mode interactif (REPL)"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.main interactive"

  agents:run:
    desc: "Lance l'orchestrateur sur un brief : task agents:run -- --brief docs/briefs/X.md"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.main autonomous {{.CLI_ARGS}}"

  agents:dry-run:
    desc: "Valide la config et termine (utile pour vérifier le .env)"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.main dry-run"

  agents:status:
    desc: "État de la flotte (logs récents, tokens, coût, approbations en attente)"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.cli status"

  agents:logs:
    desc: "Suit le execution_log.txt en live"
    cmds:
      - tail -f {{.PROJECT_ROOT}}/execution_log.txt

  agents:tail:
    desc: "Affiche les 20 dernières entrées du log (JSON pretty)"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.cli tail --n 20"

  agents:approve:
    desc: "Approuve une demande humaine : task agents:approve -- <req_id> [comment]"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.cli approve {{.CLI_ARGS}}"

  agents:reject:
    desc: "Rejette une demande humaine : task agents:reject -- <req_id> [comment]"
    cmds:
      - "{{.AGENTS_VENV}}/bin/python -m stonks_core.orchestrator.cli reject {{.CLI_ARGS}}"

  agents:index:
    desc: "Indexe le monorepo via GitNexus (graphe de dépendances pour les agents)"
    cmds:
      - cd {{.PROJECT_ROOT}} && pnpm exec gitnexus analyze --skip-agents-md .

  # ─── Backend ─────────────────────────────────────────────────────────
  backend:dev:
    desc: "Lance le backend FastAPI en mode dev (reload auto)"
    cmds:
      - "{{.BACKEND_VENV}}/bin/uvicorn stonks_backend.app:create_app --factory --reload --host 0.0.0.0 --port 8000"

  backend:test:
    desc: "Lance les tests backend avec couverture"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/python -m pytest tests/ -v --cov=stonks_backend --cov-report=term-missing"

  backend:lint:
    desc: "Lint + type-check du backend"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/ruff check src/ tests/"
      - "{{.BACKEND_VENV}}/bin/ruff format --check src/ tests/"
      - "{{.BACKEND_VENV}}/bin/mypy src/"

  backend:format:
    desc: "Formate le code backend"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/ruff format src/ tests/"

  # ─── Base de données ─────────────────────────────────────────────────
  migrate:
    desc: "Lance les migrations Alembic"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/alembic upgrade head"

  migrate:rollback:
    desc: "Annule la dernière migration"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/alembic downgrade -1"

  migrate:new:
    desc: "Crée une nouvelle migration autogenerate. Usage : task migrate:new -- 'description'"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/alembic revision --autogenerate -m '{{.CLI_ARGS}}'"

  migrate:status:
    desc: "Affiche l'état des migrations"
    dir: packages/backend
    cmds:
      - "{{.BACKEND_VENV}}/bin/alembic current"
      - "{{.BACKEND_VENV}}/bin/alembic history"

  db:reset:
    desc: "Réinitialise la DB de dev (drop + recreate + migrate)"
    cmds:
      - docker compose -f infra/compose/docker-compose.yml down postgres -v
      - docker compose -f infra/compose/docker-compose.yml up -d postgres
      - sleep 5
      - task migrate

  # ─── UI Monitoring ───────────────────────────────────────────────────
  ui:
    desc: "Lance l'UI Streamlit en foreground (dev). Pour la prod, voir ui:install"
    cmds:
      - "{{.AGENTS_VENV}}/bin/streamlit run {{.PROJECT_ROOT}}/agents_core/src/stonks_core/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"

  ui:install:
    desc: "Installe l'UI comme service systemd (daemon H24, auto-restart, boot)"
    cmds:
      - sudo bash {{.PROJECT_ROOT}}/scripts/install-systemd.sh

  ui:start:
    desc: "Démarre le service systemd stonks-ui"
    cmds:
      - sudo systemctl start stonks-ui.service

  ui:stop:
    desc: "Arrête le service systemd stonks-ui"
    cmds:
      - sudo systemctl stop stonks-ui.service

  ui:restart:
    desc: "Redémarre le service systemd stonks-ui (utile après modif config)"
    cmds:
      - sudo systemctl restart stonks-ui.service
      - sleep 2
      - systemctl is-active stonks-ui.service && echo '✅ UI active' || echo '❌ Échec'

  ui:status:
    desc: "État du service stonks-ui"
    cmds:
      - systemctl status stonks-ui.service --no-pager -l | head -20

  ui:logs:
    desc: "Logs live de l'UI (journalctl -f)"
    cmds:
      - journalctl -u stonks-ui.service -f -n 50

  # ─── Brief autonome résilient (systemd) ──────────────────────────────
  brief:start:
    desc: "Lance un brief en service systemd (résilient reboot). Usage : task brief:start -- <nom-sans-.md>"
    cmds:
      - 'test -n "{{.CLI_ARGS}}" || (echo "❌ Précise le nom du brief : task brief:start -- 2026-04-29_demo" && exit 1)'
      - 'test -f docs/briefs/{{.CLI_ARGS}}.md || (echo "❌ Brief introuvable : docs/briefs/{{.CLI_ARGS}}.md" && exit 1)'
      - sudo systemctl start stonks-brief@{{.CLI_ARGS}}.service
      - 'echo "✅ Brief lancé : stonks-brief@{{.CLI_ARGS}}"'
      - 'echo "   Logs - task brief:logs -- {{.CLI_ARGS}}"'
      - 'echo "   Stop - task brief:stop -- {{.CLI_ARGS}}"'

  brief:stop:
    desc: "Arrête un brief en cours. Usage : task brief:stop -- <nom>"
    cmds:
      - sudo systemctl stop stonks-brief@{{.CLI_ARGS}}.service

  brief:status:
    desc: "État d'un brief. Usage : task brief:status -- <nom>"
    cmds:
      - systemctl status stonks-brief@{{.CLI_ARGS}}.service --no-pager -l | head -20

  brief:logs:
    desc: "Logs live d'un brief. Usage : task brief:logs -- <nom>"
    cmds:
      - journalctl -u stonks-brief@{{.CLI_ARGS}}.service -f -n 100

  brief:list:
    desc: "Liste tous les briefs en cours d'exécution sous systemd"
    cmds:
      - systemctl list-units 'stonks-brief@*.service' --no-pager

  # ─── Stack Docker ────────────────────────────────────────────────────
  stack:up:
    desc: "Lance toute la stack via docker-compose (postgres, vault, redis, gitnexus, UI)"
    cmds:
      - docker compose -f infra/compose/docker-compose.yml up -d
      - echo "✅ Stack lancée."
      - echo "   Postgres : localhost:5432 (stonks/stonks_dev/stonks_dev)"
      - echo "   Vault    : http://localhost:8200 (token: dev-token)"
      - echo "   UI       : http://localhost:8501"

  stack:down:
    desc: "Arrête la stack"
    cmds:
      - docker compose -f infra/compose/docker-compose.yml down

  stack:logs:
    desc: "Logs de la stack"
    cmds:
      - docker compose -f infra/compose/docker-compose.yml logs -f

  stack:rebuild:
    desc: "Rebuild les images puis relance"
    cmds:
      - docker compose -f infra/compose/docker-compose.yml up -d --build

  # ─── Qualité ─────────────────────────────────────────────────────────
  lint:
    desc: "Lint JS + Python"
    cmds:
      - pnpm -r lint || true
      - cd agents_core && .venv/bin/ruff check src tests

  format:
    desc: "Formate JS + Python"
    cmds:
      - pnpm -r format || true
      - cd agents_core && .venv/bin/ruff format src tests

  test:
    desc: "Tests JS + Python"
    cmds:
      - pnpm -r test || true
      - cd agents_core && .venv/bin/pytest tests/ -v

  # ─── Git helpers ─────────────────────────────────────────────────────
  git:status:
    desc: "git status enrichi"
    cmds:
      - git status -sb
      - echo "---"
      - git log --oneline -5

  # ─── Clean ───────────────────────────────────────────────────────────
  clean:
    desc: "Nettoie les artefacts de build et caches"
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".ruff_cache" -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name "node_modules" -prune -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name ".turbo" -exec rm -rf {} + 2>/dev/null || true
      - rm -rf agents_core/.venv packages/backend/.venv

  default:
    desc: "Affiche les tâches disponibles"
    cmds:
      - task --list-all
