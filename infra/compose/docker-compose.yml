# ╔══════════════════════════════════════════════════════════════════════╗
# ║  STONKS — Stack Phase 2 (fondations backend)                          ║
# ║                                                                      ║
# ║  Services :                                                          ║
# ║    - postgres      : PostgreSQL 16 + TimescaleDB 2.x                 ║
# ║    - redis         : cache / rate limit / pub-sub                    ║
# ║    - vault         : HashiCorp Vault (dev mode, secrets)             ║
# ║    - gitnexus      : serveur HTTP GitNexus (code intelligence)       ║
# ║    - orchestrator  : orchestrateur principal (mode autonome)         ║
# ║    - ui            : Streamlit monitoring sur :8501                  ║
# ║                                                                      ║
# ║  Usage :                                                             ║
# ║    task stack:up      → lance la stack                               ║
# ║    task stack:logs    → tail -f                                      ║
# ║    task stack:down    → stop                                         ║
# ╚══════════════════════════════════════════════════════════════════════╝
name: stonks

x-common-env: &common-env
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/opt/stonks/agents_core/src"

services:
  # ── PostgreSQL 16 + TimescaleDB ────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stonks-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: stonks
      POSTGRES_PASSWORD: stonks_dev
      POSTGRES_DB: stonks_dev
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonks -d stonks_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Vault (dev mode) ──────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.18
    container_name: stonks-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - vault-data:/vault/data
      - ./vault-init.sh:/vault-init.sh:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: >
      vault server -dev
      -dev-root-token-id=dev-token
      -dev-listen-address=0.0.0.0:8200

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stonks-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── GitNexus ──────────────────────────────────────────────────────
  gitnexus:
    image: ghcr.io/abhigyanpatwari/gitnexus:latest
    container_name: stonks-gitnexus
    restart: unless-stopped
    ports:
      - "127.0.0.1:4747:4747"
    volumes:
      - gitnexus-data:/data/gitnexus
      - ../../:/workspace:ro
    environment:
      WORKSPACE_DIR: /workspace

  # ── Orchestrateur ─────────────────────────────────────────────────
  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agents
    container_name: stonks-orchestrator
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      gitnexus:
        condition: service_started
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/0
      GITNEXUS_BACKEND_URL: http://gitnexus:4747
    env_file:
      - ../../.env
    volumes:
      - ../../:/opt/stonks
    working_dir: /opt/stonks
    command: ["python", "-m", "stonks_core.orchestrator.main", "dry-run"]

  # ── UI Streamlit ──────────────────────────────────────────────────
  ui:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agents
    container_name: stonks-ui
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/0
      GITNEXUS_BACKEND_URL: http://gitnexus:4747
    env_file:
      - ../../.env
    volumes:
      - ../../:/opt/stonks
    working_dir: /opt/stonks
    ports:
      - "0.0.0.0:8501:8501"
    command:
      - streamlit
      - run
      - /opt/stonks/agents_core/src/stonks_core/ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true

volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  gitnexus-data:
    driver: local
  vault-data:
    driver: local
