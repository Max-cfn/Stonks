[project]
name = "stonks-backend"
version = "0.1.0"
description = "Stonks — Backend FastAPI (ports & adapters, production-ready)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4,<6",
    "cryptography>=43,<44",
    "hvac>=2.3,<3",
    "structlog>=24,<25",
    "slowapi>=0.1.9,<1",
    "redis>=5,<6",
    "httpx>=0.28,<1",
    "feedparser>=6,<7",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
]

[project.scripts]
stonks-api = "stonks_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stonks_backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff rules
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends() in defaults is standard FastAPI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
explicit_package_bases = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=stonks_backend --cov-report=term-missing --cov-fail-under=70"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/stonks_backend"]
omit = ["tests/*", "src/stonks_backend/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
