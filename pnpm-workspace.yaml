packages:
  - "apps/*"
  - "packages/*"

# Build scripts whitelist — qui peut compiler du code natif lors d'install.
# `pnpm install` les bloque tous par défaut (sécurité supply-chain). On autorise
# explicitement ceux dont GitNexus et ses dépendances ont besoin pour fonctionner.
# Voir aussi : package.json -> pnpm.onlyBuiltDependencies (équivalent local).
allowBuilds:
  '@ladybugdb/core': true
  # Désactivés volontairement (non utilisés par Stonks et compile flaky)
  '@scarf/scarf': false # télémétrie tierce, on en veut pas
  gitnexus: false # le package CLI lui-même, pas besoin de hook install
  onnxruntime-node: false # ML local — pas utilisé en Phase 1
  protobufjs: false # safe sans postinstall
  sharp: false # image processing — pas utilisé
  tree-sitter: true
  tree-sitter-c: true
  tree-sitter-c-sharp: true
  tree-sitter-cli: true
  tree-sitter-cpp: true
  tree-sitter-dart: false # pas de Dart dans le repo
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-kotlin: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-swift: false # pas de Swift, et build foireux sur Linux
  tree-sitter-typescript: true
